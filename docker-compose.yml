version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: support_db
    environment:
      POSTGRES_DB: support_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: support_mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: SupportTicketing.Api/Dockerfile
    container_name: support_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      AllowedHosts: "*"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=support_ticketing;Username=postgres;Password=postgres;Include Error Detail=true"
      Jwt__Secret: "SupportDeskAdaptIT2026SecureKeyLocal"
      Jwt__Issuer: "support-ticketing-api"
      Jwt__Audience: "support-ticketing-client"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      SetupKey: "AdaptIT@Setup2026"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: support_frontend
    working_dir: /app
    volumes:
      - ./SupportTicketing.Frontend:/app
    environment:
      VITE_API_BASE_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pg_data:
